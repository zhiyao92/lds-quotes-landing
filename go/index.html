<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening the App Store…</title>
<meta name="robots" content="noindex">

<!--
  Click-counting redirect.

  Every "Download on the App Store" button on the landing page points here instead of
  going straight to Apple. Cloudflare Web Analytics records this as a pageview of /go,
  so the hit count for /go IS the number of App Store button clicks. Then we bounce the
  visitor on to Apple.

  This page is mostly reached from inside the Instagram in-app browser, often via a
  link shortener, so the bounce is one plain https hop to apps.apple.com:
  - in real Safari, apps.apple.com hands straight off to the App Store app
  - in an in-app browser it loads Apple's web page for the app — listing,
    screenshots and the Get button — and the Get tap opens the App Store
  - the redirect targets window.top, in case a shortener serves the page in a frame
  - a plain meta refresh (not inside noscript) is the fallback when JS is blocked
  - the manual link stays on screen the whole time

  Deliberately NOT here: an automatic itms-apps:// retry. In webviews that had
  already loaded Apple's page it popped a "Cannot open page" dialog.

  The ?src= query string says which button was clicked (hero / final / sticky / footer)
  and shows up in Cloudflare under the /go path's query breakdown.
-->

<!-- JS-less fallback: give the analytics beacon a second, then go -->
<meta http-equiv="refresh" content="1;url=https://apps.apple.com/app/apple-store/id1506121689?pt=118418326&amp;ct=Instagram&amp;mt=8">

<link rel="icon" href="../assets/favicon.png">
<style>
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:#FBF4E4; color:#2E3226;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    text-align:center; padding:24px;
  }
  .box{max-width:320px}
  img{width:76px; height:76px; border-radius:18px; box-shadow:0 10px 30px rgba(46,50,38,.18)}
  p{color:#5C6151; font-size:15px; margin:18px 0 0}
  a{color:#6C7C4F}
  .spin{
    margin:20px auto 0; width:22px; height:22px; border-radius:50%;
    border:2.5px solid rgba(46,50,38,.15); border-top-color:#8C9C6E;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none} }
</style>
</head>
<body>
  <div class="box">
    <img src="../assets/app-icon.png" alt="LDS Quotes">
    <div class="spin" aria-hidden="true"></div>
    <p>Taking you to the App&nbsp;Store…</p>
    <p><a id="fallback" href="https://apps.apple.com/app/apple-store/id1506121689?pt=118418326&amp;ct=Instagram&amp;mt=8">Tap here if it doesn&rsquo;t open</a></p>
  </div>

<script>
(function () {
  var STORE = 'https://apps.apple.com/app/apple-store/id1506121689?pt=118418326&ct=Instagram&mt=8';

  // One https hop, nothing clever. In real Safari, apps.apple.com hands straight off
  // to the App Store app. In the Instagram in-app browser it loads Apple's web page
  // for the app — listing, screenshots and the Get button — which is exactly the
  // right landing: the user taps Get and iOS opens the App Store.
  //
  // (An earlier version auto-retried with itms-apps:// — in webviews that had
  // already loaded Apple's page it could pop a "Cannot open page" dialog, so
  // the scheme trick is now reserved for the manual link only.)

  function goTo(url) {
    // a shortener may serve us inside a frame — aim for the top window,
    // fall back to our own if cross-origin rules say no
    try { window.top.location.href = url; }
    catch (e) { window.location.href = url; }
  }

  // Short pause so the Cloudflare Web Analytics beacon fires before we navigate away.
  setTimeout(function () { goTo(STORE); }, 300);
})();
</script>
</body>
</html>
